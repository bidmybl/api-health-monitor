name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: health_monitor
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: health_monitor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U health_monitor -d health_monitor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://health_monitor:ci_password@localhost:5432/health_monitor_test?sslmode=disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golang-migrate
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run database migrations
        run: migrate -path ./migrations -database "$TEST_DATABASE_URL" up

      - name: Run tests
        run: go test ./... -v

      - name: Run race detector
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build Docker image
        run: docker build -t api-health-monitor:ci .