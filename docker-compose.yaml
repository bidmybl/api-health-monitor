services:
  db:
    image: postgres:18.6
    container_name: postgres-db
    environment:
      POSTGRES_DB: health_monitor
      POSTGRES_USER: health_monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U health_monitor -d health_monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate
    depends_on:
      db: 
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command: ["-path", "/migrations", "-database", "${DATABASE_URL:?Set DATABASE_URL in .env}", "up"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata: