services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: health_monitor
      POSTGRES_USER: health_monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg-isready -U health_monitor -d health_monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: